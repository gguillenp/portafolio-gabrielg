<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio | Gabriel Guillén</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #FFF8F6;
        }

        header {
            background: #4F000B;
            color: white;
            padding: 20px;
            text-align: left;
        }

        header h2 {
            margin: 0px 0px 0px 10px;
            font-size: 1.2em;
        }

        main {
            background: #FFF8F6;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
        }

        .presentacion {
            overflow: hidden;
            margin-bottom: 30px;
        }

        .presentacion img {
            float: left;
            margin-right: 20px;
            border: 2px solid #4F000B;
            border-radius: 8px;
        }

        .presentacion .info {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .presentacion .info h1 {
            text-align: center;
            font-weight: bold;
            font-size: 2.5em;
        }

        .presentacion .info h2 {
            color: #CE4257;
            font-size: 0.7em;
            text-align: center;
        }

        .presentacion .info p {
            font-size: 1.1em;
            text-align: center;
        }

        .presentacion .info a {
            color: #4F000B;
            font-weight: bold;
            text-decoration: none;
        }

        .presentacion .description {
            max-width: 500px;
            color: #7A5560;
        }
    </style>
</head>
<body>

    <header>
        <h2>Gabriel Guillén</h2>
    </header>
    <main>
        <section class="presentacion">
            <div class="info">
                <h2>ESTUDIANTE DE INGENIERÍA EN SISTEMAS</h2>
                <h1>Gabriel Guillén</h1>
                <div class="description">
                    <p>
                        Soy estudiante de Ingeniería en Sistemas de Información y Ciencias de la Computación.
                        Me apasiona aprender, mejorar constantemente y contribuir con mi mejor desempeño en cada proyecto.
                    </p>
                </div>
                <p>
                    <button><a href="mailto:g2.gabriel@icloud.com">Escríbeme: g2.gabriel@icloud.com</a></button>
                    <button><a href="https://www.linkedin.com/" target="_blank"> LinkedIn</a></button>
                    <button><a href="https://github.com/" target="_blank"> GitHub</a></button>
                </p>
            </div>
        </section>
        <section>
            <h3>Contáctame</h3>
            <form>
                <label>
                    Nombre:
                    <input type="text" id="name" name="Nombre" required>
                </label>

                <label>
                    Apellido:
                    <input type="text" id="lastname" name="Apellido" required>
                </label>

                <label>
                    Correo:
                    <input type="email" id="mail" name="Correo" required>
                </label>

                <label>
                    Teléfono:
                    <input type="tel" id="phone" name="Telefono" required>
                </label>

                <label>
                    Servicio a seleccionar:
                    <select id="Servicio" name="Servicio" required>
                        <option value="Página Web">Página Web</option>
                        <option value="Aplicación">Aplicación</option>
                        <option value="Otros">Otros</option>
                    </select>
                </label>

                <label>
                    Horario para contactarte:
                    <select id="Horario" name="Horario" required>
                        <option value="horario1">8:00 a 10:00 a.m.</option>
                        <option value="horario2">10:00 a 12:00 p.m.</option>
                        <option value="horario3">1:00 p.m. a 3:00 p.m.</option>
                        <option value="horario4">3:00 p.m. a 5:00 p.m.</option>
                    </select>
                </label>

                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>
    <script>
        console.log("Hola Mundo");
    </script>
</body>
</html>
